<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d1116" />
    <meta name="description" content="Tactical Ops — 3D-шутер с ботами. Играйте в браузере на компьютере и телефоне." />
    <title>Tactical Ops — Играть онлайн</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
      /* No `cursor: none` here. Pointer lock hides the cursor by itself while
         you are playing; forcing it hidden also hid it in the pause menu, so
         every menu click was aimed with an invisible pointer. */
      #game { display: block; width: 100vw; height: 100dvh; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
